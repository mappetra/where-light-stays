#moj-loading-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #000; /* Crna pozadina */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999; /* Da bude iznad svega */
    margin: 0;
    padding: 0;
    transition: opacity 0.8s ease; /* Za glatko nestajanje */
}

#loading-logo {
    width: 120px;
    height: auto;
    /* Spajamo u jednu animaciju */
    animation: spinAndPulse 3s linear infinite;
}

@keyframes spinAndPulse {
    0% { transform: rotate(0deg) scale(1); opacity: 1; }
    50% { transform: rotate(180deg) scale(1.2); opacity: 0.9; }
    100% { transform: rotate(360deg) scale(1); opacity: 1; }
}
.loader-wrapper {
    display: flex;
    flex-direction: column; /* Ređa elemente jedan ispod drugog */
    align-items: center;    /* Centriranje po horizontali */
    justify-content: center;
    gap: 30px;   
    width: 100%;         /* Osigurava da se wrapper širi */
    max-width: 300px;           /* Razmak između logotipa i teksta */
}
#loading-text {
    color: white;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 3px;
    animation: pulsiranjeTeksta 3s infinite ease-in-out;
}
@keyframes pulsiranjeTeksta {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}
.tacke {
    font-size: 1.2em;
}
.tacke span {
    opacity: 0;
    animation: pojaviSe 4s infinite;
}
.tacke span:nth-child(1) { animation-delay: 0.5s; }
.tacke span:nth-child(2) { animation-delay: 1.0s; }
.tacke span:nth-child(3) { animation-delay: 1.5s; } 
@keyframes pojaviSe {
    0%, 30%, 100% { opacity: 0; } /* Veći deo vremena su nevidljive */
    40%, 60% { opacity: 1; }      /* Kratko se pale u ritmu */
}
.hidden { display: none !important; }
#add-light-modal.hidden { display: none !important; }

.menu-footer {
    margin-top: auto; /* Ovo ga gura na samo dno */

.footer-links {

.footer-links a {

.footer-links a:hover {

.mini-player {

}

/* 2. Informacije o pesmi - ograničene širine */
.player-info {
    font-size: 13px;
    font-family: 'Manrope', sans-serif;

    overflow: hidden;

}

/* 3. Kontrole - sve u liniji */
.player-controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

/* 4. Volume sistem (skriven klizač) */
.volume-container {
    position: relative; /* Ovo ostavi */
    width: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#volume-slider {
    display: none;
    position: absolute;
    transform: translateX(-50%) rotate(-90deg);
    bottom: 80px; /* pomeri ga više nagore, van crne kutije */
    left: 44%;
    width: 80px;
    height: 6px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 5px;
    appearance: none;
    cursor: pointer;
    z-index: 99999 !important; /* Što veći broj */
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
}
.volume-container.active #volume-slider {
    display: block;
}
#volume-slider::-webkit-slider-thumb {
    appearance: none;
    width: 12px;
    height: 12px;
    background: #8da9c4;
    border-radius: 50%;
    cursor: pointer;
}

/* Stil za sva dugmad */
.player-controls button {
    background: none;
    border: none;
    font-size: 14px;
    color: white;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 5px;
    transition: color opacity 0.2s;
}

.player-controls button:hover {
    opacity: 0.7;
    color: #8da9c4;
}

/* Loop dugme - blago providno kad nije aktivno */
#loop-btn { 
    color: white;
}
#loop-btn:hover {
    color: #8da9c4;
}

<script>
    
    const firebaseConfig = {
        apiKey: "AIzaSyCYLkTirz4bhDLrIC3jSW3n7g8FytRJn6Y",
        authDomain: "where-light-stays.firebaseapp.com",
        projectId: "where-light-stays",

        measurementId: "G-WC1P90W1X9"
    };
    window.sviMarkeriObjekat = {};
    let trenutniLat, trenutniLng;

    let rezimDodavanja = false
    function omoguciDodavanjeMarkera() {
    rezimDodavanja = true;
    toggleMenu(); // Zatvori meni nakon klika
    map.getContainer().style.cursor = 'crosshair'; // Promeni kursor da zna da je u "modu"

}
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const map = L.map('map', { 
    attributionControl: true, 
    zoomControl: false 
}).setView([44.78, 20.44], 13);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',

}).addTo(map);

    const zvukKlika = new Audio('marker-klik1.mp3');

    let isRegisterMode = false;
    
    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        const usernameField = document.getElementById('username');
        
        document.getElementById('auth-title').innerText = isRegisterMode ? "Sign up" : "Sign in";
        document.getElementById('toggle-text').innerText = isRegisterMode ? "Already have an account? Sign in" : "Don't have an account? Sign up";
        
        usernameField.style.display = isRegisterMode ? "block" : "none";
    }

    async function izvrsiAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const username = document.getElementById('username').value;

        try {
            if (isRegisterMode) {
                const res = await auth.createUserWithEmailAndPassword(email, pass);

function getOpacity(timestamp) {
    // Simuliramo da je marker star 10 dana (10 * 24 * 60 * 60 * 1000 milisekundi)
    const desetDana = 864000000; 
    const fakeAge = desetDana; 
    
    // Formula sa kojom smo radili (2 nedelje period bledenja)
    const dveNedelje = 14 * 24 * 60 * 60 * 1000;
    let opacity = 1 - (fakeAge / dveNedelje); 
    
    // Ograničenja
    return Math.max(0.2, Math.min(1, opacity));
}
    function ucitajSveMarkere() {
    db.collection("markeri").onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
            if (change.type === "added" || change.type === "modified") {
                const podaci = change.doc.data();
                const docId = change.doc.id;
                console.log("Timestamp markera:", podaci.timestamp);
                const timestamp = podaci.timestamp || Date.now();
                
                // Koristi funkciju getOpacity koju smo napravile ranije
                const trenutniOpacity = getOpacity(timestamp);
                console.log("Marker:", podaci.text, "Age (hours):", (Date.now() - podaci.timestamp) / 3600000, "Opacity:", trenutniOpacity);
                const ikona = L.divIcon({ 
                    className: 'svetionik-marker', 
                    iconSize: [12, 12], 
                    iconAnchor: [6, 6] 
                });
                
                const m = L.marker([podaci.lat, podaci.lng], { icon: ikona, opacity: trenutniOpacity }).addTo(map);
                
                // Koristimo window objekat da izbegnemo grešku pri inicijalizaciji
                window.sviMarkeriObjekat[docId] = m;

                m.on('click', () => {
                    m.setOpacity(1);
                    
                    // 2. Ažuriranje u bazi da se ne bi odmah vratio u staro stanje
                    db.collection("markeri").doc(docId).update({
                        timestamp: Date.now()
                    });
                    const nemaMuzike = !podaci.muzika || podaci.muzika.trim() === "";
                    if (nemaMuzike) {
                        if (typeof zvukKlika !== 'undefined') {
                            zvukKlika.currentTime = 0;
                            zvukKlika.play();
                        }
                    }
                });

                // 1. PRVO pripremamo datum
               let datumPoruke = "";
    if (podaci.vreme && podaci.vreme.toDate) {
    datumPoruke = podaci.vreme.toDate().toLocaleDateString();
    } else if (podaci.timestamp) {
    datumPoruke = new Date(podaci.timestamp).toLocaleDateString();
    } else {
    datumPoruke = new Date().toLocaleDateString();
    }

        let tekstPopupa = `<span class="objavljena-poruka">${podaci.text}</span>
                   <div style="font-size: 10px; color: #666; margin-top: 8px; font-style: italic;">
                   ${datumPoruke}</div>`;
                
                // 3. Dodajemo audio ako postoji
                if (podaci.muzika && podaci.muzika.trim() !== "") {
                    const audioId = "audio-" + docId;
                    tekstPopupa += `<audio id="${audioId}" src="${podaci.muzika}"></audio>`;
                    
                    m.on('popupopen', () => {
                        const audio = document.getElementById(audioId);
                        if (audio) {
                            audio.play().catch(e => console.log("Autoplay blocked"));
                        }
                    });

                    m.on('popupclose', () => {
                        const audio = document.getElementById(audioId);
                        if (audio) {
                            audio.pause();
                            audio.currentTime = 0;
                        }
                    });
                }

                m.bindPopup(tekstPopupa);
            }
        });
    });
}

async function snimiMarkerSaAdrese() {
    const adresa = document.getElementById('modal-adresa').value;
    const poruka = document.getElementById('modal-tekst').value;
    const muzika = document.getElementById('modal-muzika').value;

    if (!adresa) return alert("Please enter an address");

    try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(adresa)}`);
        const results = await response.json();

        if (results && results.length > 0) {
            const lat = parseFloat(results[0].lat);
            const lng = parseFloat(results[0].lon);
            
            await db.collection("markeri").add({
                text: poruka,
                muzika: muzika,
                lat: lat,
                lng: lng,
                korisnik: auth.currentUser.displayName || auth.currentUser.email,
                vreme: firebase.firestore.FieldValue.serverTimestamp(),
                timestamp: new Date().getTime()
            });
            
            document.getElementById('add-light-modal').classList.add('hidden');
            document.getElementById('modal-adresa').value = "";
            document.getElementById('modal-tekst').value = "";
            document.getElementById('modal-muzika').value = "";
            alert("Light added successfully!");
        } else {
            alert("Address not found.");
        }
    } catch (e) {
        console.error("Error:", e);
        alert("Error saving: " + e.message);
    }
}

const playlist = [
    { name: "Moon Drift", url: "audio/Paper Moon Drift.mp3" },
    { name: "Tape Drift", url: "audio/Tape Drift.mp3" },
    { name: "Late Train Dust", url: "audio/Late Train Dust.mp3" },
    { name: "Horizon", url: "audio/Glass Horizon.mp3" },
    { name: "Empty Hotizon", url: "audio/Empty Horizon.mp3" },
];

let currentTrackIndex = 0;
const audioPlayer = new Audio();
const trackName = document.getElementById('track-name');
const playPauseBtn = document.getElementById('play-pause-btn');

function loadTrack(index) {
    audioPlayer.src = playlist[index].url;
    trackName.innerText = playlist[index].name;
}

function togglePlayback() {
    const icon = document.querySelector('#play-pause-btn i');
    if (audioPlayer.paused) {
        audioPlayer.play();
        icon.className = "fa-solid fa-pause";
    } else {
        audioPlayer.pause();
        icon.className = "fa-solid fa-play";
    }
}

function nextTrack() {
    currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
    loadTrack(currentTrackIndex);
    audioPlayer.play();
}

function prevTrack() {
    currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
    loadTrack(currentTrackIndex);
    audioPlayer.play();
}

// Loop cele liste
audioPlayer.onended = nextTrack;
let isLooping = false; // Status loop-a

// Funkcija za promenu jačine zvuka
function changeVolume(val) {
    audioPlayer.volume = val;
}

// Funkcija za Loop jedne pesme
function toggleLoop() {
    isLooping = !isLooping;
    audioPlayer.loop = isLooping;
    const btn = document.getElementById('loop-btn');
    btn.style.color = isLooping ? "#8da9c4" : "white"; // Beli outline (kroz boju teksta)
}

// Update funkcije nextTrack da poštuje loop
function nextTrack() {
    if (isLooping) {
        audioPlayer.currentTime = 0;
        audioPlayer.play();
    } else {
        currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
        loadTrack(currentTrackIndex);
        audioPlayer.play();
    }
}

        });
    }
}
